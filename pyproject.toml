[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "story-pipeline"
version = "0.1.0"
description = "Children's story generation pipeline for ESL curriculum"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "textstat>=0.7.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
story-pipeline = "src.cli.app:cli"

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (real API calls)"]
